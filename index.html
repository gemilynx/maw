<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>For Maw — A Small Apology</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1:#FFF0F5;
      --bg2:#FFF7ED;
      --card:#ffffffee;
      --accent:#FF6B8A;
      --accent2:#FFB7C5;
      --muted:#555;
      --soft:#fff6f8;
    }
    html,body{height:100%;margin:0;font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,Arial; background:linear-gradient(135deg,var(--bg1),var(--bg2)); -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;}
    .stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;box-sizing:border-box;cursor:pointer;overflow:hidden;position:relative;}
    /* parallax background layers */
    .bg-layer{ position:absolute; inset:0; pointer-events:none; z-index:0; }
    .bg-blob{ position:absolute; width:40vw; height:40vw; max-width:560px; max-height:560px; border-radius:40%; filter:blur(48px); opacity:.28; transform:translate3d(0,0,0); }
    .blob1{ background: radial-gradient(circle at 30% 20%, #ffd6e0, #ff9aa2 60%); left:-8%; top:-6%; transform-origin:center; }
    .blob2{ background: radial-gradient(circle at 70% 80%, #fff0e0, #ffd3b6 60%); right:-6%; bottom:-12%; transform-origin:center; }

    .card{ width:100%; max-width:760px; background:var(--card); border-radius:20px; padding:44px 36px; box-shadow: 0 14px 40px rgba(16,24,40,0.08); text-align:center; position:relative; z-index:3; }
    .title{ font-size:14px; color:var(--muted); margin:0 0 12px 0; font-weight:500; letter-spacing:.6px; }
    .slide{ font-size:clamp(18px,2.4vw,26px); color:#222; line-height:1.5; min-height:90px; white-space:pre-wrap; margin:0; }
    .controls{ margin-top:18px; display:flex; gap:10px; justify-content:center; align-items:center; }
    .btn{ background:linear-gradient(90deg,var(--accent),var(--accent2)); color:white; border:0; padding:8px 14px; border-radius:999px; font-weight:700; cursor:pointer; box-shadow:0 8px 20px rgba(255,120,150,0.12); }
    .btn.ghost{ background:transparent; color:var(--muted); border:1px solid rgba(0,0,0,0.06); box-shadow:none; font-weight:600; }
    .muted{ color:var(--muted); font-size:13px; margin-top:12px; display:block; }

    .fx{ position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:2; }
    .particle{ position:absolute; will-change:transform,opacity; user-select:none; font-size:16px; }
    .sticker{ position:absolute; will-change:transform,opacity; pointer-events:none; padding:6px 10px; border-radius:14px; background: #fff; box-shadow:0 10px 30px rgba(0,0,0,0.12); font-weight:700; }

    .sound-toggle{ position:absolute; right:12px; top:10px; background:transparent; border:0; cursor:pointer; z-index:6; font-size:18px; }

    /* progress bar */
    .progress{ height:6px; width:100%; background:#f1f1f1; border-radius:999px; overflow:hidden; margin-top:18px; }
    .progress > span{ display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); width:0%; transition:width .45s ease; }

    /* forgiveness choices overlay */
    .choiceRow{ display:flex; gap:12px; justify-content:center; margin-top:16px; }
    .bigBtn{ padding:12px 18px; font-size:16px; border-radius:14px; border:0; cursor:pointer; font-weight:800; box-shadow:0 12px 30px rgba(0,0,0,0.08); }
    .forgive{ background: linear-gradient(90deg,#ff9ab6,#ffd0b6); color:#401217; }
    .stillmad{ background: linear-gradient(90deg,#e0e6ff,#d0ffd8); color:#274; }

    /* confetti full-shower */
    .confetti{ position:absolute; width:10px; height:16px; transform-origin:center; opacity:1; }

    /* meme big */
    .memeBig{ position:absolute; left:50%; top:30%; transform:translate(-50%,-20%) scale(.9); padding:18px 22px; border-radius:18px; background:white; box-shadow:0 30px 60px rgba(0,0,0,0.16); font-weight:900; font-size:36px; z-index:8; pointer-events:none; opacity:0; will-change:transform,opacity; }
    .memeBig.show{ animation:memePop 1.4s forwards; }
    @keyframes memePop { 0%{ transform:translate(-50%,-20%) scale(.72) rotate(-12deg); opacity:0 } 12%{ transform:translate(-50%,-28%) scale(1.06) rotate(6deg); opacity:1 } 60%{ transform:translate(-50%,-120%) scale(1) rotate(0deg); opacity:1 } 100%{ transform:translate(-50%,-220%) scale(.95) rotate(-6deg); opacity:0 } }

    @media (max-width:480px){ .card{ padding:28px 18px; border-radius:16px; } .memeBig{ font-size:22px; padding:12px 14px; } }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-live="polite" role="main">
    <div class="bg-layer" aria-hidden="true">
      <div class="bg-blob blob1"></div>
      <div class="bg-blob blob2"></div>
    </div>

    <section class="card" id="card" role="article" aria-label="Apology card">
      <button class="sound-toggle" id="soundToggle" title="Toggle sounds">🔊</button>
      <div class="title">A little note for you</div>
      <p class="slide" id="slideText" aria-atomic="true"></p>

      <div class="controls" id="controls">
        <div class="progress" aria-hidden="true"><span id="progressFill"></span></div>
      </div>

      <div class="muted" id="hint">Click or press Space/Enter after the message finishes to continue.</div>
      <div id="extraControls" style="margin-top:12px;display:flex;gap:10px;justify-content:center;align-items:center">
        <button class="btn ghost" id="voiceBtn" title="Toggle read-aloud">🔈 Read aloud</button>
        <button class="btn ghost" id="restartBtn">Restart</button>
      </div>
    </section>

    <div class="fx" id="fx" aria-hidden="true"></div>
    <div class="memeBig" id="memeBig" aria-hidden="true"></div>
  </main>

  <script>
    /* ======================
       Content and state
       ====================== */
    const slides = [
"hi! are you maw? if yes, click anywhere to proceed.",
"hi maw! how are you? i know you're not doing well :3 let's do something for that sad face of yours! click anywhere to continue!",
"before anything else, I'm really sorry for what I've done the last couple of days. I'm sorry if i made you sad and unmotivated. this maw felt guilty bcs i made you sad. :( (press anything to continue)",
"but all i want is what i think is best for you, nothing else. :)",
"if you are still reading this, i want you to smile BIG for me. flueseeeeeeeee? U_U (please choose below — forgive or exit)",
"you forgive me, YEHEY!!! i always love you maw, and i hope this effort can make your day a little bit better. <3"
    ];
    const stage = document.getElementById('stage');
    const slideText = document.getElementById('slideText');
    const fx = document.getElementById('fx');
    const memeBig = document.getElementById('memeBig');
    const progressFill = document.getElementById('progressFill');
    const soundToggle = document.getElementById('soundToggle');
    const voiceBtn = document.getElementById('voiceBtn');
    const restartBtn = document.getElementById('restartBtn');

    let idx = 0;
    let typing = false;
    let soundEnabled = localStorage.getItem('maw_sound') !== '0';
    let voiceEnabled = false;

    // initialize buttons
    function updateSoundUI(){ soundToggle.textContent = soundEnabled ? '🔊' : '🔈'; soundToggle.title = soundEnabled ? 'Sounds on — click to mute' : 'Muted — click to enable sounds'; }
    updateSoundUI();
    updateVoiceUI();
    function updateVoiceUI(){ voiceBtn.textContent = voiceEnabled ? '🔊 Reading' : '🔈 Read aloud'; voiceBtn.title = voiceEnabled ? 'Reading enabled — click to disable' : 'Enable read aloud'; }

    /* ======================
       Typing / pacing
       ====================== */
    async function typeSlide(text, el, speed = 28){
      typing = true;
      el.textContent = '';
      let i = 0;
      while(i < text.length){
        // reveal char-by-char; faster for spaces/punctuation
        el.textContent += text[i];
        i++;
        // small variable delay to feel natural
        const ch = text[i-1];
        let delay = speed + Math.random()*8;
        if(ch === ' '){ delay = speed*0.18; }
        else if(/[.,!?;:]/.test(ch)){ delay = speed*1.2; }
        await new Promise(r => setTimeout(r, delay));
      }
      typing = false;
      // update progress
      progressFill.style.width = Math.round(((idx+1) / slides.length) * 100) + '%';
      // read aloud optionally
      if(voiceEnabled) speak(text);
    }

    function renderCurrent(){
      // special handling: if we're on the forgiveness prompt (idx === 4), show choices
      if(idx === 4){
        // show the prompt text and then a choice UI
        typeSlide(slides[idx], slideText, 24).then(() => showForgivenessChoices());
      } else {
        // normal slides
        typeSlide(slides[idx], slideText, 26);
        // hide any lingering choice UI
        hideForgivenessChoices();
      }
    }

    /* ======================
       Forgiveness choices UI
       ====================== */
    function showForgivenessChoices(){
      // create two big buttons under the card if not present
      if(document.getElementById('forgiveRow')) return;
      const row = document.createElement('div');
      row.id = 'forgiveRow';
      row.className = 'choiceRow';
      row.style.marginTop = '16px';
      row.innerHTML = `
        <button class="bigBtn forgive" id="btnForgive">I forgive you 💗</button>
        <button class="bigBtn stillmad" id="btnStill">I'm still mad</button>
      `;
      document.querySelector('.card').appendChild(row);

      document.getElementById('btnForgive').addEventListener('click', (e) => {
        e.stopPropagation();
        onForgive();
      });
      document.getElementById('btnStill').addEventListener('click', (e) => {
        e.stopPropagation();
        onStillMad();
      });
    }
    function hideForgivenessChoices(){
      const el = document.getElementById('forgiveRow');
      if(el) el.remove();
    }

    /* ======================
       Visual effects: particles, stickers, confetti, memes
       ====================== */
    const confettiColors = ['#FF9AA2','#FFD3B6','#FFDEB4','#B5EAD7','#C7CEEA','#F5B7D6'];

    function spawnParticle(x,y,content,style){
      const p = document.createElement('div');
      p.className = 'particle';
      p.textContent = content;
      if(style) Object.assign(p.style, style);
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      fx.appendChild(p);
      const lifetime = 1000 + Math.random()*1200;
      const angle = (Math.random()*Math.PI*2);
      const speed = 60 + Math.random()*200;
      const vx = Math.cos(angle)*speed;
      const vy = Math.sin(angle)*speed * -1.0;
      const start = performance.now();
      function frame(now){
        const t = now - start;
        const dt = t / lifetime;
        const cx = vx * dt * 0.012;
        const cy = vy * dt * 0.012 + 280 * (dt*dt) * 0.006;
        p.style.transform = `translate(${cx}px, ${cy}px) rotate(${dt*720}deg) scale(${1 - dt*0.4})`;
        p.style.opacity = String(Math.max(0, 1 - dt));
        if(t < lifetime) requestAnimationFrame(frame);
        else p.remove();
      }
      requestAnimationFrame(frame);
    }

    function burst(x,y,count=22){
      for(let i=0;i<count;i++){
        const r = Math.random();
        if(r < 0.28) spawnParticle(x + (Math.random()*20-10), y + (Math.random()*20-10), '❤', { color: confettiColors[Math.floor(Math.random()*confettiColors.length)], fontSize: (12 + Math.random()*24)+'px' });
        else if(r < 0.72) spawnParticle(x + (Math.random()*24-12), y + (Math.random()*24-12), '•', { color: confettiColors[Math.floor(Math.random()*confettiColors.length)], fontSize: (8 + Math.random()*14)+'px' });
        else spawnParticle(x + (Math.random()*24-12), y + (Math.random()*24-12), '✦', { color: confettiColors[Math.floor(Math.random()*confettiColors.length)], fontSize: (10 + Math.random()*18)+'px' });
      }
    }

    // big confetti shower used on forgiveness
    function confettiShower(){
      const rect = stage.getBoundingClientRect();
      const count = 120;
      for(let i=0;i<count;i++){
        const el = document.createElement('div');
        el.className = 'confetti';
        el.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
        el.style.width = (6 + Math.random()*10)+'px';
        el.style.height = (8 + Math.random()*18)+'px';
        el.style.left = Math.random()*rect.width + 'px';
        el.style.top = '-40px';
        el.style.transform = `rotate(${Math.random()*360}deg)`;
        fx.appendChild(el);
        const fall = 1600 + Math.random()*1400;
        const start = performance.now();
        const sway = (Math.random()*160) - 80;
        function frame(now){
          const t = now - start;
          const dt = t / fall;
          el.style.transform = `translateY(${dt* (rect.height + 300)}px) rotate(${dt*720 + Math.random()*120}deg)`;
          el.style.left = (parseFloat(el.style.left) + Math.sin(dt * Math.PI * 2 + i) * sway * 0.004) + 'px';
          el.style.opacity = String(Math.max(0,1 - dt*1.1));
          if(t < fall) requestAnimationFrame(frame);
          else el.remove();
        }
        requestAnimationFrame(frame);
      }
    }

    const memeOptions = [
      {text:'YAY 🎉'}, {text:'uwu 💗'}, {text:'NO U ✨'}, {text:'pog 😲'}, {text:'LOL 😂'}, {text:'you rock 💫'}
    ];
    function showBigMeme(x,y){
      const pick = memeOptions[Math.floor(Math.random()*memeOptions.length)];
      memeBig.textContent = pick.text;
      memeBig.classList.remove('show');
      // place near click but centered-friendly
      memeBig.style.left = (x || window.innerWidth/2) + 'px';
      memeBig.style.top = (y || window.innerHeight/3) + 'px';
      // show animation
      void memeBig.offsetWidth;
      memeBig.classList.add('show');
      setTimeout(()=> memeBig.classList.remove('show'), 1500);
    }

    /* ======================
       Sound engine (WebAudio synth)
       ====================== */
    let audioCtx = null;
    function ensureAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{}); return audioCtx; }
    function playClick(){ if(!soundEnabled) return; const ctx = ensureAudio(); const o = ctx.createOscillator(); const g = ctx.createGain(); o.type = 'triangle'; o.frequency.value = 880 + Math.random()*160; g.gain.value = 0.0001; o.connect(g); g.connect(ctx.destination); const now = ctx.currentTime; g.gain.exponentialRampToValueAtTime(0.12, now + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.12); o.start(now); o.stop(now + 0.16); }
    function playPop(){ if(!soundEnabled) return; const ctx = ensureAudio(); const bufferSize = Math.floor(0.02 * ctx.sampleRate); const b = ctx.createBuffer(1, bufferSize, ctx.sampleRate); const d = b.getChannelData(0); for(let i=0;i<bufferSize;i++) d[i] = (Math.random()*2-1) * Math.exp(-i / (bufferSize*0.02)); const src = ctx.createBufferSource(); src.buffer = b; const filter = ctx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = 700; src.connect(filter); filter.connect(ctx.destination); src.start(); }
    function playMemeHit(){ if(!soundEnabled) return; const ctx = ensureAudio(); const now = ctx.currentTime; const osc = ctx.createOscillator(); const g = ctx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(140, now); osc.frequency.exponentialRampToValueAtTime(40, now + 0.32); g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(0.9, now + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.6); osc.connect(g); g.connect(ctx.destination); osc.start(now); osc.stop(now + 0.7); }

    /* ======================
       Speech synthesis
       ====================== */
    function speak(text){
      if(!voiceEnabled) return;
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const ut = new SpeechSynthesisUtterance(text);
      ut.rate = 0.95; ut.pitch = 1.05; ut.lang = 'en-US';
      window.speechSynthesis.speak(ut);
    }

    /* ======================
       Interaction handlers
       ====================== */
    // clicking the stage advances only when typing finished (except forgiveness slide)
    stage.addEventListener('click', (e) => {
      const t = e.target;
      if(t.matches('.bigBtn') || t.closest('#forgiveRow') || t === soundToggle || t === voiceBtn || t === restartBtn) return;
      ensureAudio();
      playClick();
      // stickers and meme hits sometimes
      const rect = stage.getBoundingClientRect();
      const cx = e.clientX - rect.left;
      const cy = e.clientY - rect.top;
      burst(e.clientX - rect.left, e.clientY - rect.top, 10);
      playPop();
      if(Math.random() < 0.28){ setTimeout(()=>{ playMemeHit(); showBigMeme(e.clientX, e.clientY); }, 80); }
      // only advance when typing finished and not on forgiveness slide
      if(typing) return;
      if(idx === 4){
        // we don't auto-advance on forgiveness slide; we show choices
        return;
      }
      nextSlide();
    });

    // keyboard controls
    window.addEventListener('keydown', (e) => {
      if(e.code === 'Space' || e.key === ' ' || e.key === 'Enter'){
        e.preventDefault();
        ensureAudio();
        playClick();
        if(typing) return;
        if(idx === 4) return; // force explicit choice
        const rect = stage.getBoundingClientRect();
        burst(rect.width/2, rect.height/2, 12);
        if(Math.random() < 0.3){ playMemeHit(); showBigMeme(rect.width/2, rect.height/3); }
        nextSlide();
      }
    });

    // sound toggle
    soundToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      soundEnabled = !soundEnabled;
      localStorage.setItem('maw_sound', soundEnabled ? '1' : '0');
      updateSoundUI();
      if(soundEnabled) ensureAudio();
    });

    // voice toggle
    voiceBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      voiceEnabled = !voiceEnabled;
      updateVoiceUI();
      if(voiceEnabled && !typing) speak(slideText.textContent || slides[idx]);
    });

    restartBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      idx = 0;
      renderCurrent();
      burst(window.innerWidth/2, 150, 18);
      playMemeHit();
    });

    // advance helper
    function nextSlide(){
      if(idx < slides.length - 1) idx++;
      else idx = 0;
      renderCurrent();
    }

    /* ======================
       Forgiveness handlers (core emotional interaction)
       ====================== */
    function onForgive(){
      // show heartfelt celebration: confetti shower, sound, big meme, then final slide
      confettiShower();
      playMemeHit();
      showBigMeme(window.innerWidth/2, window.innerHeight/2 - 80);
      // small burst near card
      const cRect = document.querySelector('.card').getBoundingClientRect();
      burst(cRect.left + cRect.width/2, cRect.top + 60, 34);
      // move to final slide after a short pause so the user can enjoy
      setTimeout(()=>{
        idx = 5; renderCurrent();
      }, 900);
    }
    function onStillMad(){
      // gentle calming message
      // replace the card content with a soft note and offer "try again"
      const calmText = "I understand. Take your time. I don't want to rush you — I'll be here whenever you're ready.";
      slideText.textContent = '';
      typeSlide(calmText, slideText, 22);
      // show a small "try again" button
      hideForgivenessChoices();
      const tryBtn = document.createElement('div');
      tryBtn.style.marginTop = '14px';
      tryBtn.innerHTML = `<button class="btn ghost" id="tryAgainBtn">Try again</button>`;
      document.querySelector('.card').appendChild(tryBtn);
      document.getElementById('tryAgainBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        idx = 0;
        renderCurrent();
        tryBtn.remove();
      });
      // soft sound
      playPop();
    }

    /* ======================
       Parallax subtle motion
       ====================== */
    document.addEventListener('mousemove', (e) => {
      const blob1 = document.querySelector('.blob1');
      const blob2 = document.querySelector('.blob2');
      const cx = e.clientX / window.innerWidth - 0.5;
      const cy = e.clientY / window.innerHeight - 0.5;
      if(blob1) blob1.style.transform = `translate3d(${cx * -18}px, ${cy * -14}px, 0) rotate(${cx*8}deg)`;
      if(blob2) blob2.style.transform = `translate3d(${cx * 22}px, ${cy * 18}px, 0) rotate(${cx*-6}deg)`;
    });

    /* ======================
       Init
       ====================== */
    function init(){
      progressFill.style.width = Math.round(((idx+1) / slides.length) * 100) + '%';
      updateSoundUI();
      updateVoiceUI();
      // small initial effect
      burst(window.innerWidth/2, 120, 8);
      renderCurrent();
      // focus for keyboard
      stage.tabIndex = -1;
      stage.focus();
    }
    init();

    // cleanup stray nodes periodically
    setInterval(()=> {
      const children = fx.children;
      for(let i=children.length-1;i>=0;i--){
        const el = children[i];
        if(el && parseFloat(getComputedStyle(el).opacity) <= 0.02) el.remove();
      }
    }, 3000);
  </script>
</body>
</html>
